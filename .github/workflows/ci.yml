name: Maintenance SQL
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m maintenance_sql --output /tmp/sql-reports
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Installed wheel outside repository
        run: |
          python -m venv /tmp/sql-wheel
          /tmp/sql-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/sql-wheel/bin/maintenance-sql --output /tmp/sql-wheel-reports
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-sql-${{ matrix.python }}
          path: |
            /tmp/sql-reports
            dist
